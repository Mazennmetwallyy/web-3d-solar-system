<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive 3D Solar System Explorer — explore all eight planets and the Sun in real-time 3D." />
  <title>Solar System Explorer</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <!-- Custom styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- THREE.js import map -->
  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Skip link for keyboard / screen-reader navigation -->
  <a class="skip-link" href="#solar-canvas">Skip to 3D scene</a>

  <!-- ── Loading Screen ──────────────────────────────────────────────── -->
  <div id="loading-screen" role="status" aria-label="Loading solar system">
    <div class="loading-title">☀ Solar System</div>
    <div class="loading-subtitle">Initialising 3D Scene…</div>
    <div class="loading-bar-wrap">
      <div class="loading-bar"></div>
    </div>
    <div class="loading-subtitle pulse" id="loading-msg">Loading planet textures…</div>
  </div>

  <!-- ── Navigation ──────────────────────────────────────────────────── -->
  <nav class="navbar navbar-expand-lg fixed-top" aria-label="Main navigation">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="index.html" aria-label="Solar System Explorer home">
        <span class="brand-icon" aria-hidden="true">🪐</span>
        Solar System Explorer
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navMenu" aria-controls="navMenu"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav gap-1" role="list">
          <li class="nav-item">
            <a class="nav-link active" href="index.html" aria-current="page">🌌 Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="explore.html">🔭 Explore</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">📄 About</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ── THREE.js Canvas ─────────────────────────────────────────────── -->
  <main id="scene-wrapper" aria-label="3D Solar System Scene">
    <canvas id="solar-canvas" aria-label="Interactive 3D solar system. Use mouse to orbit. Click any planet to explore it."></canvas>
  </main>

  <!-- ── Planet Name Labels (positioned by JS each frame) ────────────── -->
  <div id="planet-labels" aria-hidden="true"></div>

  <!-- ── Hover Tooltip ───────────────────────────────────────────────── -->
  <div id="planet-tooltip" role="tooltip" aria-live="polite"></div>

  <!-- ── Controls Panel (left) ───────────────────────────────────────── -->
  <button class="panel-toggle" id="panel-toggle-btn"
          aria-label="Toggle controls panel" title="Toggle controls">☰</button>

  <aside class="side-panel" id="controls-panel" aria-label="Scene controls">

    <div class="panel-section">
      <div class="panel-title">Animation</div>
      <button class="btn-space mb-2" id="btn-pause" aria-pressed="false">
        <span aria-hidden="true">⏸</span> Pause Orbits
      </button>
      <div class="speed-label">
        <span>Speed</span>
        <span id="speed-display">1.0×</span>
      </div>
      <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1"
             aria-label="Animation speed" title="Animation speed" />
    </div>

    <div class="panel-section">
      <div class="panel-title">Display</div>
      <button class="btn-space mb-2 active" id="btn-orbits" aria-pressed="true">
        <span aria-hidden="true">⭕</span> Orbit Rings
      </button>
      <button class="btn-space mb-2 active" id="btn-labels" aria-pressed="true">
        <span aria-hidden="true">🏷</span> Planet Labels
      </button>
      <button class="btn-space mb-2" id="btn-wireframe" aria-pressed="false">
        <span aria-hidden="true">🔲</span> Wireframe Mode
      </button>
      <button class="btn-space active" id="btn-bloom" aria-pressed="true">
        <span aria-hidden="true">✨</span> Bloom Effect
      </button>
    </div>

    <div class="panel-section">
      <div class="panel-title">Lighting</div>
      <button class="btn-space mb-2 active" id="btn-sunlight" aria-pressed="true">
        <span aria-hidden="true">☀</span> Sun Light
      </button>
      <button class="btn-space active" id="btn-ambient" aria-pressed="true">
        <span aria-hidden="true">💡</span> Ambient Light
      </button>
    </div>

    <div class="panel-section">
      <div class="panel-title">Audio</div>
      <button class="btn-space btn-gold" id="btn-audio" aria-pressed="false">
        <span aria-hidden="true">🔇</span> Space Ambience
      </button>
    </div>

    <div class="panel-section">
      <div class="panel-title">Camera</div>
      <button class="btn-space mb-2" id="btn-reset-cam">
        <span aria-hidden="true">🎯</span> Reset Camera
      </button>
    </div>

    <div class="panel-section">
      <div class="panel-title" style="color: var(--text-muted); font-size:0.68rem;">
        Click a planet to explore it in detail →
      </div>
    </div>

  </aside>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Solar System scene -->
  <script type="module" src="js/solar-system.js"></script>
</body>
</html>
